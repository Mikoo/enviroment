name: Validate Cross-AI Environment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full Cross-AI & machine safety checks
        run: bash scripts/check-repo.sh
